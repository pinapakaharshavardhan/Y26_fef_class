<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tables</title>
</head>
<body>
    <h2>HTML TABLE TAG EXAMPLE</h2>
    <table border="1">

        <caption> student marks</caption>
        <colgroup>
        <col style="background-color: lightblue;">
        <col style="background-color: lightcyan;">
        <col style="background-color: lightgreen">
        </colgroup>
        <thead>
        <tr>
            <th>student name</th>
            <th>subjects</th>
            <th>marks</th>
        </tr>
        </thead>
        <tr>
            <td rowspan="2" style="padding: 20px;">sathvik</td>
            <td>HTML</td>
            <td>98</td>
        </tr>
        <tr>
            
            <td>HTML</td>
            <td>98</td>
        </tr>
        <tr>
            <td rowspan="2" style="padding: 20px;">harsha</td>
            <td>HTML</td>
            <td>98</td>
        </tr>
        <tr>
            
            <td>HTML</td>
            <td>98</td>
        </tr>
        <tr>
            <td colspan="2" style="padding: 20px;">total students</td>
            <td>2</td>
        </tr>
    </table>
</body>
</html>
